<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURUM · Units Inventory</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071513;--panel:rgba(16,46,40,.76);--panel2:rgba(10,32,28,.94);--line:rgba(201,168,120,.26);--gold:#c9a878;--gold2:#d4b88c;--ink:#eaf3fa;--muted:#9bbac8;--green:#8aab9e;--serif:Georgia,'Iowan Old Style','Times New Roman',serif}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#166b68 0,#0b3a36 38%,var(--bg) 100%);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none} .page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.mark{width:46px;height:46px;border:1px solid var(--gold);border-radius:14px;display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-weight:700}.brand h1{font-family:var(--serif);font-size:22px;letter-spacing:.22em;margin:0;color:var(--gold)}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.12em}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.ghost{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.06em}.nav a.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,120,.13)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.36);backdrop-filter:blur(14px)}.intro{padding:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:800;text-transform:uppercase}.intro h2{font-family:var(--serif);font-size:42px;line-height:1.05;margin:12px 0;color:#fff}.intro p{color:var(--muted);line-height:1.6;margin:0;max-width:700px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}.metric{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,120,.16);border-radius:14px;padding:16px}.metric strong{display:block;font-size:24px;color:#fff}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0;flex-wrap:wrap}.search{width:min(420px,100%);background:var(--panel2);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:13px 14px;font:inherit}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter-btn{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:10px;padding:8px 12px;font-size:11px;cursor:pointer;color:var(--muted);font-weight:600;transition:all 0.2s}.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,120,.12)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.unit-card{padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}.unit-header{display:flex;justify-content:space-between;align-items:flex-start}.unit-title{font-family:var(--serif);font-size:22px;margin:0;font-weight:700}.unit-type{color:var(--muted);font-size:11px;letter-spacing:.05em;margin-top:2px}.badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;text-transform:uppercase}.badge-available{background:rgba(95,240,168,.14);color:var(--green);border:1px solid rgba(95,240,168,.25)}.badge-reserved{background:rgba(201,168,120,.14);color:var(--gold);border:1px solid rgba(201,168,120,.25)}.badge-sold{background:rgba(255,99,196,.14);color:var(--pink);border:1px solid rgba(255,99,196,.25)}.badge-onhold{background:rgba(255,255,255,.1);color:var(--muted);border:1px solid rgba(255,255,255,.15)}.unit-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.unit-stat{background:rgba(255,255,255,.02);border:1px solid rgba(201,168,120,.1);border-radius:10px;padding:8px 10px}.unit-stat .v{font-size:14px;font-weight:700;color:var(--ink)}.unit-stat .v.gold{color:var(--gold)}.unit-stat .k{font-size:8px;letter-spacing:.1em;color:var(--muted);margin-top:2px;text-transform:uppercase}.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}.actions a{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 8px;color:var(--gold);font-size:12px;font-weight:800;transition:all 0.2s}.actions a:hover{border-color:var(--gold);background:rgba(201,168,120,.05)}.actions .primary{background:rgba(201,168,120,.14);border-color:var(--gold)}.actions .primary:hover{background:var(--gold);color:#1a1205}.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr}.intro h2{font-size:34px}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.page{width:min(100% - 20px,1180px);padding-top:14px}.brand h1{font-size:18px}.nav{width:100%}.nav a{flex:1;text-align:center}.intro{padding:20px}.intro h2{font-size:30px}.summary{grid-template-columns:1fr 1fr;padding:12px}.metric{padding:13px}.metric strong{font-size:19px}.grid{grid-template-columns:1fr;gap:10px}.unit-card{padding:12px;gap:8px}.unit-stat{padding:6px 8px}.actions a{padding:11px 8px;font-size:11px;min-height:44px;display:flex;align-items:center;justify-content:center}.toolbar{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.filters{width:100%;gap:6px}.filter-btn{flex:1;text-align:center;padding:8px 4px;font-size:10px}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <a class="brand" href="/">
      <div class="mark">A</div>
      <div><h1>AURUM</h1><p>UNIT INVENTORY</p></div>
    </a>
    <nav class="nav" aria-label="AURUM pages">
      <a href="/">3D Twin</a>
      <a href="/floors">Floors</a>
      <a class="active" href="/units">Units</a>
    </nav>
  </header>
  <section class="hero">
    <div class="intro card">
      <div class="eyebrow">AURUM by Meteora</div>
      <h2 id="page-title">Browse all units.</h2>
      <p>Interactive unit pricing schedules and yield statistics matching live database data. Click any unit to see it in the 3D twin or view its layout specifications.</p>
    </div>
    <div class="summary card" id="summary"></div>
  </section>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search Unit, Type, Status..." />
    <div class="filters" id="status-filters">
      <button class="filter-btn active" data-status="all">All Statuses</button>
      <button class="filter-btn" data-status="available">Available</button>
      <button class="filter-btn" data-status="reserved">Reserved</button>
      <button class="filter-btn" data-status="sold">Sold</button>
    </div>
  </div>
  <section id="units" class="grid" aria-live="polite"></section>
</main>
<script>
const money = value => new Intl.NumberFormat('en-AE',{maximumFractionDigits:0}).format(value || 0);
const sqft = value => new Intl.NumberFormat('en-AE',{maximumFractionDigits:0}).format(value || 0) + ' sq ft';
let unitsData = [];
let activeFloor = null;
let activeStatus = 'all';

// Extract floor parameter from URL
const urlParams = new URLSearchParams(window.location.search);
const floorParam = urlParams.get('floor');
if (floorParam) {
  activeFloor = Number(floorParam);
  document.getElementById('page-title').textContent = activeFloor === 1 ? 'Browse Ground Floor Units.' : `Browse Level 0${activeFloor - 1} Units.`;
}

function labelFloor(n){ return Number(n) === 1 ? 'Ground' : 'Level ' + String(n - 1).padStart(2,'0'); }
function unitClass(u) {
  const t = String(u.type || '').toLowerCase();
  if (t.includes('office')) return 'Office Suite';
  if (t.includes('townhouse')) return 'Townhouse';
  if (t.includes('duplex')) return 'Duplex Office';
  return u.type || 'Commercial Suite';
}
function statusOf(u) {
  return u.status || 'Available';
}
function statusClass(s) {
  return String(s || '').toLowerCase().replace(' ', '');
}
function psfOf(u) {
  const size = Number(u.size || 0);
  return size >= 1500 ? 2350 : 2500;
}
function priceOf(u) {
  return Number(u.sellingPrice || 0) || (Number(u.size || 0) * psfOf(u));
}

function renderSummary(units){
  const totalArea = units.reduce((sum,u)=>sum + Number(u.size || 0),0);
  const totalValue = units.reduce((sum,u)=>sum + priceOf(u),0);
  document.getElementById('summary').innerHTML = [
    [units.length,'Units Displayed'],
    [sqft(totalArea),'Total Area'],
    ['AED ' + money(totalValue),'GDV Value']
  ].map(([v,k])=>`<div class="metric"><strong>${v}</strong><span>${k}</span></div>`).join('');
}

function render(query=''){
  const q = query.trim().toLowerCase();
  let filtered = unitsData;
  
  if (activeFloor !== null) {
    filtered = filtered.filter(u => u.f === activeFloor);
  }
  if (activeStatus !== 'all') {
    filtered = filtered.filter(u => statusOf(u).toLowerCase() === activeStatus);
  }
  if (q) {
    filtered = filtered.filter(u => 
      String(u.u).toLowerCase().includes(q) || 
      unitClass(u).toLowerCase().includes(q) || 
      statusOf(u).toLowerCase().includes(q)
    );
  }

  const target = document.getElementById('units');
  target.innerHTML = filtered.length ? filtered.map(u => {
    const status = statusOf(u);
    const badge = statusClass(status);
    const price = priceOf(u);
    return `
    <article class="unit-card card">
      <div class="unit-header">
        <div>
          <h3 class="unit-title">Unit ${u.u}</h3>
          <div class="unit-type">${unitClass(u)} · ${labelFloor(u.f)}</div>
        </div>
        <span class="badge badge-${badge}">${status}</span>
      </div>
      <div class="unit-details">
        <div class="unit-stat"><div class="v">${sqft(u.size)}</div><div class="k">Area</div></div>
        <div class="unit-stat"><div class="v">${psfOf(u)} AED</div><div class="k">Rate PSF</div></div>
        <div class="unit-stat" style="grid-column: 1 / -1;"><div class="v gold">AED ${money(price)}</div><div class="k">Selling Price</div></div>
      </div>
      <div class="actions">
        <a href="/?unit=${encodeURIComponent(u.u)}" class="primary">3D Twin View</a>
      </div>
    </article>`;
  }).join('') : '<div class="empty card">No units match your selection.</div>';
  
  renderSummary(filtered);
}

// Bind status filter buttons
document.getElementById('status-filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeStatus = btn.dataset.status;
  render(document.getElementById('search').value);
});

fetch('/aurum_assets/pricing_data.json')
  .then(res => res.json())
  .then(data => {
    // Map JSON properties to u and f structure
    unitsData = (data.units || []).map(u => ({
      u: u.unitNumber || u.u,
      f: Number(u.floor || u.f),
      s: Number(u.size || u.s),
      type: u.type || u.type1,
      status: u.status || 'Available',
      sellingPrice: u.sellingPrice
    }));
    render();
  })
  .catch(() => { document.getElementById('units').innerHTML = '<div class="empty card">Could not load units data.</div>'; });

document.getElementById('search').addEventListener('input', event => render(event.target.value));
</script>
</body>
</html>
